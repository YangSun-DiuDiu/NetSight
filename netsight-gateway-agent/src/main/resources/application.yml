server:
  # 本地管理页面端口（路由器风格，仅内网访问）
  port: 8081
  # 生产部署建议绑定内网网卡地址（如 192.168.1.60）；0.0.0.0 仅用于本地开发
  address: 0.0.0.0

spring:
  application:
    name: nams-gateway-agent
  web:
    resources:
      static-locations: classpath:/static/
  mvc:
    throw-exception-if-no-handler-found: false

logging:
  config: classpath:logback-spring.xml
  file:
    path: ${nams.log-path:/opt/nams-gateway/logs}
